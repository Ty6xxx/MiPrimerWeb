<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rust+ Bot - Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Tahoma, sans-serif;
      background: #0a0a1a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #12122a;
      border: 1px solid #2a2a4a;
      border-radius: 12px;
      padding: 30px;
      width: 450px;
    }
    .card h1 { color: #cd412b; margin-bottom: 5px; }
    .card .sub { color: #666; margin-bottom: 25px; font-size: 0.9em; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; margin-bottom: 5px; color: #aaa; font-size: 0.9em; }
    .form-group input {
      width: 100%;
      padding: 12px;
      background: #0a0a1a;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e0e0e0;
      font-size: 1em;
      font-family: monospace;
    }
    .form-group input:focus { outline: none; border-color: #cd412b; }
    .hint { font-size: 0.8em; color: #555; margin-top: 4px; }
    .hint a { color: #5c7cfa; text-decoration: none; }
    .btn {
      width: 100%;
      padding: 14px;
      background: #cd412b;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
    }
    .btn:hover { background: #e04530; }
    .msg { margin-top: 15px; padding: 10px; border-radius: 8px; display: none; font-size: 0.9em; }
    .msg.ok { display: block; background: #1a3a1a; color: #4caf50; border: 1px solid #2a6a2a; }
    .msg.err { display: block; background: #3a1a1a; color: #f44; border: 1px solid #6a2a2a; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Admin - Config del Bot</h1>
    <p class="sub">Estos datos son tuyos (developer), el cliente no los ve.</p>

    <div class="form-group">
      <label>Discord Bot Token</label>
      <input type="password" id="bot-token" placeholder="Tu token de bot">
      <p class="hint"><a href="https://discord.com/developers/applications" target="_blank">Discord Developer Portal</a> > Bot > Reset Token</p>
    </div>

    <div class="form-group">
      <label>Discord Client ID (Application ID)</label>
      <input type="text" id="client-id" placeholder="Ej: 123456789012345678">
      <p class="hint">General Information > Application ID</p>
    </div>

    <button class="btn" onclick="save()">Guardar</button>
    <div class="msg" id="msg"></div>
  </div>

  <script>
    // Cargar config existente
    fetch('/api/admin/bot-config')
      .then(r => r.json())
      .then(data => {
        if (data.clientId) {
          document.getElementById('client-id').value = data.clientId;
        }
        if (data.configured) {
          document.getElementById('bot-token').placeholder = '******** (ya configurado)';
        }
      });

    async function save() {
      const token = document.getElementById('bot-token').value.trim();
      const clientId = document.getElementById('client-id').value.trim();
      const msg = document.getElementById('msg');

      if (!token || !clientId) {
        msg.className = 'msg err';
        msg.textContent = 'Completa ambos campos.';
        return;
      }

      try {
        const res = await fetch('/api/admin/save-bot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ discordToken: token, discordClientId: clientId }),
        });
        const data = await res.json();
        if (data.success) {
          msg.className = 'msg ok';
          msg.textContent = 'Guardado! Los clientes ya pueden usar la web principal.';
        }
      } catch (err) {
        msg.className = 'msg err';
        msg.textContent = 'Error: ' + err.message;
      }
    }
  </script>
</body>
</html>
